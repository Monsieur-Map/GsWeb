<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="card mx-auto shadow-lg" style="max-width: 400px">
        <div class="card-body">
          <h3 class="text-center mb-4">Đăng ký</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Nhập email"
              />
              <small class="text-danger" id="emailError"></small>
            </div>
            <div class="mb-3">
              <label class="form-label">Mật khẩu</label>
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
              />
              <small class="text-danger" id="passwordError"></small>
            </div>
            <div class="mb-3">
              <label class="form-label">Nhập lại mật khẩu</label>
              <input
                type="password"
                id="confirm_password"
                class="form-control"
                placeholder="Nhập lại mật khẩu"
              />
              <small class="text-danger" id="passwordError"></small>
            </div>
            <button type="button" id="signup" class="btn btn-primary w-100">
              Đăng ký
            </button>
            <button
              type="button"
              id="google_btn"
              class="btn btn-danger w-100 mt-2"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512">
                <!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path
                  d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"
                />
              </svg>
              Đăng nhập với Google
            </button>
            <button
              type="button"
              id="facebook_btn"
              class="btn btn-primary w-100 mt-2 d-flex align-items-center justify-content-center"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path
                  d="M512 256C512 114.6 397.4 0 256 0S0 114.6 0 256C0 376 82.7 476.8 194.2 504.5V334.2H141.4V256h52.8V222.3c0-87.1 39.4-127.5 125-127.5c16.2 0 44.2 3.2 55.7 6.4V172c-6-.6-16.5-1-29.6-1c-42 0-58.2 15.9-58.2 57.2V256h83.6l-14.4 78.2H287V510.1C413.8 494.8 512 386.9 512 256h0z"
                />
              </svg>
              Đăng nhập bằng facebook
            </button>
            <a href="../index.html"> Sign up </a>
          </form>
          <p class="text-center mt-3" id="user-info"></p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../js/firebase.js"></script>
  </body>
</html>
